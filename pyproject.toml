[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "radon_bridge"
version = "0.2.0"
description = "Householder Radon communication through explicit MHD V4 graphs"
requires-python = ">=3.10"
dependencies = ["torch>=2.8", "torchvision>=0.23", "numpy", "pandas", "Pillow", "scikit-learn", "scipy"]

[tool.setuptools]
packages = ["radon_bridge", "radonbridge", "V4"]
package-dir = {"radon_bridge" = "radon_bridge", "radonbridge" = "radonbridge", "V4" = "third_party/MHD_Project/V4"}
