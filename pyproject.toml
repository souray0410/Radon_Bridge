[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "radonbridge"
version = "0.1.0"
description = "Householder Radon communication through explicit MHD V4 graphs"
requires-python = ">=3.10"
dependencies = ["torch>=2.8", "numpy", "pandas", "Pillow", "scikit-learn", "scipy"]

[tool.setuptools]
packages = ["radonbridge", "V4"]
package-dir = {"radonbridge" = "radonbridge", "V4" = "third_party/MHD_Project/V4"}
