name: Research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cumulative research publication coverage
        run: PYTHONPATH=src python -m radon_bridge.analysis.publication_coverage --root docs/reports/current
      - run: python -m venv .venv
      - name: Install CPU test dependencies and locked project
        run: |
          .venv/bin/python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          . .venv/bin/activate
          bash scripts/bootstrap.sh
      - run: .venv/bin/python scripts/manage.py test
      - name: Two-rank MHD trainer reference
        run: .venv/bin/python -m torch.distributed.run --standalone --nproc-per-node=2 -m tests.integration.runtime_ddp
